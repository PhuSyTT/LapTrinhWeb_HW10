spring.application.name=JWT_springboot3
server.port=8005

# ===================================================================
# 1. DATABASE CONFIGURATION (Default: H2 in-memory để chạy ngay không lỗi)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:jwt_springboot3;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console tại: http://localhost:8005/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# ===================================================================
