<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spring Boot REST API with AJAX Example - Nimbus JWT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }
        .navbar-custom {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        }
        .profile-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            border: none;
            overflow: hidden;
            margin-top: 30px;
        }
        .profile-avatar {
            width: 110px;
            height: 110px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #0d6efd;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .token-display {
            background-color: #212529;
            color: #0df2c9;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            word-break: break-all;
            padding: 12px;
            border-radius: 8px;
            max-height: 140px;
            overflow-y: auto;
        }
        .starter-template {
            padding: 20px 0;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark navbar-custom px-4 shadow-sm">
    <a class="navbar-brand fw-bold" href="#">
        <i class="bi bi-shield-lock-fill me-2"></i> Spring Boot 3 + Nimbus JWT Security
    </a>
    <div class="d-flex align-items-center">
        <span class="text-white-50 me-3 small d-none d-md-inline">REST API Client</span>
        <button id="logout" class="btn btn-outline-light btn-sm">
            <i class="bi bi-box-arrow-right me-1"></i> Logout
        </button>
    </div>
</nav>

<div class="container" style="min-height: 500px">
    <div class="starter-template text-center mt-4">
        <h1 class="display-6 fw-bold text-primary">Spring Boot REST API with AJAX Example</h1>
        <p class="text-muted">Dữ liệu được xác thực qua token Nimbus JOSE + JWT từ Bearer Authentication Header</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card profile-card p-4 text-center">
                <div class="mb-3">
                    <img id="images" class="profile-avatar" src="" alt="Avatar" width="110">
                </div>

                <h3 id="profile" class="fw-bold mb-1 text-dark">Đang tải thông tin...</h3>
                <p id="userEmail" class="text-muted mb-3"><i class="bi bi-envelope me-1"></i> ...</p>

                <div class="row g-2 text-start bg-light p-3 rounded mb-3">
                    <div class="col-6">
                        <small class="text-muted d-block">ID Người dùng</small>
                        <span id="userId" class="fw-semibold">--</span>
                    </div>
                    <div class="col-6">
                        <small class="text-muted d-block">Trạng thái tài khoản</small>
                        <span class="badge bg-success"><i class="bi bi-check-circle me-1"></i> Active</span>
                    </div>
                    <div class="col-12 mt-2">
                        <small class="text-muted d-block">Ngày tạo</small>
                        <span id="userCreatedAt" class="fw-semibold small">--</span>
                    </div>
                </div>

                <div class="text-start mt-2">
                    <label class="form-label fw-bold small text-secondary">
                        <i class="bi bi-key-fill me-1"></i> Nimbus JWT Bearer Token (Lưu trong LocalStorage):
                    </label>
                    <div id="tokenBox" class="token-display">Chưa có token</div>
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <button class="btn btn-secondary btn-sm" onclick="window.location.reload();">
                        <i class="bi bi-arrow-clockwise me-1"></i> Làm mới API
                    </button>
                    <button id="logoutBtnSecondary" class="btn btn-danger btn-sm" onclick="$('#logout').click();">
                        <i class="bi bi-power me-1"></i> Đăng xuất
                    </button>
                </div>

                <div id="feedback" class="mt-3 text-danger small"></div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="/js/mainjs.js"></script>
</body>
</html>
