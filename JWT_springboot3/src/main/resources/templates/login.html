<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Login - Spring Boot 3 Security 6 JWT (Nimbus)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .auth-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            overflow: hidden;
            width: 100%;
            max-width: 460px;
            transition: all 0.3s ease;
        }
        .auth-header {
            background: linear-gradient(135deg, #0d6efd 0%, #0b5ed7 100%);
            color: white;
            padding: 28px 24px;
            text-align: center;
        }
        .auth-header h3 {
            margin: 0;
            font-weight: 700;
            font-size: 1.5rem;
        }
        .auth-header p {
            margin: 8px 0 0;
            opacity: 0.85;
            font-size: 0.9rem;
        }
        .auth-body {
            padding: 30px 24px;
        }
        .form-floating label {
            color: #6c757d;
        }
        .btn-auth {
            padding: 12px;
            font-weight: 600;
            border-radius: 8px;
            letter-spacing: 0.5px;
        }
        .nav-pills .nav-link {
            border-radius: 8px;
            font-weight: 600;
            color: #495057;
        }
        .nav-pills .nav-link.active {
            background-color: #0d6efd;
        }
        .badge-nimbus {
            background-color: #e7f1ff;
            color: #0d6efd;
            border: 1px solid #b6d4fe;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            display: inline-block;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="auth-header">
        <span class="badge-nimbus"><i class="bi bi-shield-check me-1"></i> Nimbus JOSE + JWT</span>
        <h3>Hệ Thống Xác Thực JWT</h3>
        <p>Spring Boot 3 &bull; Spring Security 6</p>
    </div>

    <div class="auth-body">
        <!-- Tabs for Login / Register -->
        <ul class="nav nav-pills nav-fill mb-4" id="authTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="login-tab" data-bs-toggle="pill" data-bs-target="#login-panel" type="button" role="tab">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Đăng nhập
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="register-tab" data-bs-toggle="pill" data-bs-target="#register-panel" type="button" role="tab">
                    <i class="bi bi-person-plus me-1"></i> Đăng ký
                </button>
            </li>
        </ul>

        <div class="tab-content" id="authTabContent">
            <!-- Login Form (matches slides: #email, #password, #login) -->
            <div class="tab-pane fade show active" id="login-panel" role="tabpanel">
                <form id="loginForm" onsubmit="return false;">
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Email</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" name="email" id="email" required="required" placeholder="name@example.com" value="trungnh@hcmute.edu.vn">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control" name="password" id="password" required="required" autocomplete="on" placeholder="Mật khẩu" value="123456">
                        </div>
                    </div>

                    <div class="d-grid mt-4">
                        <button id="login" type="button" class="btn btn-primary btn-auth">
                            <i class="bi bi-lock-fill me-1"></i> Login
                        </button>
                    </div>

                    <div class="alert alert-info mt-3 py-2 small" role="alert">
                        <i class="bi bi-info-circle me-1"></i> Tài khoản mẫu: <strong>trungnh@hcmute.edu.vn</strong> / <strong>123456</strong>
                    </div>
                </form>
            </div>

            <!-- Register Form -->
            <div class="tab-pane fade" id="register-panel" role="tabpanel">
                <form id="registerForm" onsubmit="return false;">
                    <div class="mb-3">
                        <label for="regFullName" class="form-label fw-semibold">Họ và tên</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="regFullName" placeholder="Nguyễn Văn A" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="regEmail" class="form-label fw-semibold">Email</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="regEmail" placeholder="user@example.com" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="regPassword" class="form-label fw-semibold">Mật khẩu</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control" id="regPassword" placeholder="Nhập mật khẩu" required>
                        </div>
                    </div>

                    <div class="d-grid mt-4">
                        <button id="btnRegister" type="button" class="btn btn-success btn-auth">
                            <i class="bi bi-check-circle me-1"></i> Đăng ký tài khoản
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div id="feedback" class="mt-3"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="/js/mainjs.js"></script>
</body>
</html>
